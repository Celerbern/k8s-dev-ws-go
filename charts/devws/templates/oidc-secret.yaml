{{- if .Values.oidc.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devws.name" . }}-oidc
  namespace: {{ include "devws.namespace" . }}
  labels:
    {{- include "devws.labels" . | nindent 4 }}
type: Opaque
stringData:
  issuerUrl: {{ .Values.oidc.issuerUrl | quote }}
  clientId: {{ .Values.oidc.clientId | quote }}
  clientSecret: {{ .Values.oidc.clientSecret | quote }}
  redirectUrl: {{ .Values.oidc.redirectUrl | quote }}
  {{- with .Values.oidc.usernameClaim }}
  usernameClaim: {{ . | quote }}
  {{- end }}
  {{- with .Values.oidc.scopes }}
  scopes: {{ . | quote }}
  {{- end }}
  {{- with .Values.oidc.clientAuthStyle }}
  clientAuthStyle: {{ . | quote }}
  {{- end }}
{{- end }}
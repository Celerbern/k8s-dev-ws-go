apiVersion: v1
kind: Service
metadata:
  name: {{ include "devws.name" . }}-web
  namespace: {{ include "devws.namespace" . }}
  labels:
    {{- include "devws.labels" . | nindent 4 }}
    {{- if .Values.metrics.enabled }}
    devws.io/metrics: "true"
    {{- end }}
spec:
  type: {{ .Values.service.web.type }}
  selector:
    {{- include "devws.selectorLabels" . | nindent 4 }}
  ports:
    - name: web
      port: {{ .Values.service.web.port }}
      targetPort: web
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devws.name" . }}-ssh
  namespace: {{ include "devws.namespace" . }}
  labels:
    {{- include "devws.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.ssh.type }}
  selector:
    {{- include "devws.selectorLabels" . | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.service.ssh.port }}
      targetPort: ssh
      {{- if and (eq .Values.service.ssh.type "NodePort") .Values.service.ssh.nodePort }}
      nodePort: {{ .Values.service.ssh.nodePort }}
      {{- end }}
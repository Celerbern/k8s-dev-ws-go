              message:
                description: Message carries human-readable detail about the current
                  phase.
                type: string
              namespace:
                description: Namespace is the per-user namespace managed for this
                  user.
                type: string
              phase:
                description: Phase is "Ready", "Provisioning" or "Terminating".
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
